global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'flask_backend'
    static_configs:
      - targets: ['backend:5000']

  - job_name: 'flask_frontend'
    static_configs:
      - targets: ['frontend:8080']

  - job_name: 'custom_exporter'
    static_configs:
      - targets: ['exporter:18000']
